[package]
name = "mira"
version = "0.1.0"
description = "VRChat Activity Journal"
authors = ["CosmoArtsStore"]
edition = "2021"

[lib]
name = "mira_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
# Cargo.lock の解決済みバージョンに合わせて pin。tauri 本体 (2.11.x) とビルド時整合を保つ。
tauri-build = { version = "2.6.0", features = [] }

[dependencies]
# Cargo.lock 解決済みバージョン (2.11.0) に合わせて pin。
tauri = { version = "2.11.0", features = ["protocol-asset"] }
tauri-plugin-single-instance = "2.4.2"
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "0.38", features = ["bundled"] }
winreg = "0.52"
chrono = { version = "0.4", features = ["serde"] }

# StellaRecord と同じ品質ポリシー。unwrap/expect/panic 経路はコンパイル時に弾く。
[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "warn"
print_stdout = "warn"
too_many_lines = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
# IPC コマンドの shape を保つため値渡しを許可
needless_pass_by_value = "allow"
# 引数 7 個超の関数を許可（Tauri コマンドのリファクタ影響大）
too_many_arguments = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = true
# L6 Build-1: debuginfo を完全に落とし、release バイナリと並行出力される .pdb
#   (mira.pdb / mira_lib.pdb) の生成を抑止する。
#   - debug = false  : Rust 側の debuginfo emit を無効化。
#   - strip = true   : 残存シンボルを最終バイナリから除去。
#   Windows MSVC では加えて linker に `/DEBUG:NONE` を渡す必要があるため、
#   その指定は `.cargo/config.toml` の rustflags 側で行う (Cargo.toml では
#   `[profile.release.package]` の linker-arg 指定が安定していないため)。
debug = false
